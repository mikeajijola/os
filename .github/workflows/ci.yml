name: om CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: npm ci
      - run: zig fmt --check build.zig src/
      - run: zig build test
      - run: npm run build:native
      - run: npm run test:native
      - run: npm run test:types
      - run: node examples/contract.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: om-native-${{ matrix.os }}
          path: zig-out/lib/om.node
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run test:wasm
      - uses: actions/upload-artifact@v4
        with:
          name: om-wasm
          path: zig-out/bin/om-core.wasm
